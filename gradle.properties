org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=false
# aarch64 host: AGP's bundled aapt2 from Maven is x86_64-only.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
kotlin.incremental=true
